[project]
name = "discord-music-bot"
version = "1.0.0"
dependencies = [
    "discord.py[voice]==2.3.2",
    "yt-dlp==2024.8.6",
    "spotipy==2.24.0",
    "aiohttp==3.9.5",
    "pynacl==1.5.0",
    "ffmpeg-python==0.2.0",
    "python-dotenv==1.0.1"
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
